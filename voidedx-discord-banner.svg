<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">VoidedX animated community banner</title>
  <desc id="desc">A dark violet and cyan animated VoidedX banner with its logo and creator tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080912"/><stop offset=".52" stop-color="#111127"/><stop offset="1" stop-color="#071923"/>
      <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/><stop offset=".48" stop-color="#c4b5fd" stop-opacity=".48"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="halo"><stop stop-color="#4f46e5" stop-opacity=".35"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#a5b4fc" stroke-opacity=".065" stroke-width="1"/></pattern>
  </defs>
  <rect width="960" height="540" rx="28" fill="url(#bg)"/>
  <ellipse cx="730" cy="248" rx="230" ry="210" fill="url(#halo)" filter="url(#blur)">
    <animate attributeName="rx" values="210;255;210" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".7;1;.7" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <rect width="960" height="540" rx="28" fill="url(#grid)"/>
  <path d="M-160 85 1120 405" stroke="url(#beam)" stroke-width="120" opacity=".7">
    <animateTransform attributeName="transform" type="translate" values="-150 -35;150 35;-150 -35" dur="9s" repeatCount="indefinite"/>
  </path>
  <g fill="#a5f3fc" filter="url(#glow)">
    <circle cx="790" cy="112" r="2.5"><animate attributeName="opacity" values=".25;1;.25" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="866" cy="328" r="2"><animate attributeName="opacity" values="1;.2;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="625" cy="395" r="2.5"><animate attributeName="opacity" values=".2;1;.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="710" cy="84" r="1.8"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
  <g transform="translate(72 106)">
    <image href="voidedx-logo.svg" x="0" y="0" width="70" height="70"/>
    <text x="88" y="48" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="900" letter-spacing="5">VOIDEDX</text>
  </g>
  <text x="78" y="268" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="900" letter-spacing="-2">SCRIPT CONTROL</text>
  <text x="82" y="321" fill="#a5b4fc" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="5">VERIFY  /  PROTECT  /  CREATE</text>
  <path d="M82 361H465" stroke="#334155" stroke-width="2"/>
  <path d="M82 361H260" stroke="url(#beam)" stroke-width="3">
    <animate attributeName="x2" values="140;430;140" dur="4s" repeatCount="indefinite"/>
  </path>
  <text x="82" y="410" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500">Your scripts, access rules, and protection settings.</text>
  <text x="82" y="478" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="4">VOIDEDX CREATOR PANEL</text>
  <rect x="1" y="1" width="958" height="538" rx="27" fill="none" stroke="#818cf8" stroke-opacity=".25" stroke-width="2"/>
</svg>
